<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F1E7">
<title>เดิน · สวนบ้านแก้ว</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Charm&family=Trirong:wght@600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="tw-config.js"></script>
<link rel="stylesheet" href="styles.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  :root { --top: max(12px, env(safe-area-inset-top)); }
  #map { position: fixed; inset: 0; background: #ECE7DA; z-index: 0; }

  .topbar { position: fixed; top: var(--top); left: 12px; right: 12px; z-index: 1000; max-width: 560px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 6px 6px 10px;
    background: var(--card); border-radius: 999px; box-shadow: var(--shadow-soft); }
  .topbar a { color: var(--ink); text-decoration: none; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .topbar .ttl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .leftcol { position: fixed; left: 12px; top: calc(var(--top) + 62px); z-index: 1000; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; right: 72px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--card); color: var(--ink); border-radius: 999px;
    padding: 7px 14px 7px 11px; font: 500 .88rem/1.4 var(--f-body); box-shadow: var(--shadow-soft); }
  .pill.on { background: var(--forest); color: #fff; }
  .pill .ico { color: var(--pink); } .pill.on .ico { color: #fff; }
  .fac-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .fac-chips[hidden] { display: none; }

  .ctrl { position: fixed; right: 12px; top: calc(var(--top) + 62px); z-index: 1000; display: flex; flex-direction: column; background: var(--card); border-radius: 16px; box-shadow: var(--shadow-soft); overflow: hidden; }
  .ctrl button { width: 46px; height: 46px; border: 0; background: transparent; color: var(--ink); display: grid; place-items: center; }
  .ctrl button + button { border-top: 1px solid var(--line); }
  .ctrl button.on { background: var(--moss-soft); color: var(--forest); }

  .panel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000; max-width: 560px; margin: 0 auto; background: var(--card);
    border-radius: 28px 28px 0 0; box-shadow: var(--shadow-sheet); padding: 8px 18px max(18px, env(safe-area-inset-bottom)); }
  .panel { touch-action: none; transition: transform .25s ease; }
  .panel.dragging { transition: none; user-select: none; }
  .handle { display: block; width: 100%; border: 0; background: transparent; padding: 6px 0 12px; cursor: grab; touch-action: none; }
  .panel.mini .handle::after { content: "ปัดขึ้นเพื่อดูเพิ่ม"; display: block; text-align: center; font: 500 .72rem/1 var(--f-body); color: var(--slate); margin-top: 6px; }
  html[lang="en"] .panel.mini .handle::after { content: "Swipe up for more"; }
  html[lang="zh-Hans"] .panel.mini .handle::after { content: "上滑查看更多"; }
  .handle::before { content: ""; display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto; }
  .panel.mini .collapsible { display: none; }
  .next-thumb { width: 56px; height: 56px; border-radius: 16px; background: var(--blossom-soft); color: var(--pink); display: grid; place-items: center;
    font-family: var(--f-head); font-weight: 700; font-size: 1.6rem; flex: none; }
  .track { height: 8px; border-radius: 4px; background: var(--paper-deep); overflow: hidden; }
  .track i { display: block; height: 100%; width: 0; background: var(--forest); border-radius: 4px; transition: width .4s; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; background: var(--paper); border-radius: 16px; padding: 10px 4px; }
  .stats b { display: block; font-weight: 600; font-size: 1.12rem; line-height: 1.35; }
  .stats span { font-size: .72rem; color: var(--ink-soft); letter-spacing: .03em; }
  .warn { color: var(--pink) !important; }
  @media (min-width: 900px) {
    .panel { left: 16px; right: auto; bottom: 16px; width: 390px; margin: 0; border-radius: 24px; }
    .leftcol { left: 422px; }
  }

  .toast-bk { position: fixed; left: 50%; top: calc(var(--top) + 62px); z-index: 1500; transform: translate(-50%, -8px); opacity: 0; pointer-events: none;
    display: flex; align-items: center; gap: 8px; max-width: calc(100% - 24px); padding: 10px 16px; border-radius: 999px;
    background: var(--forest-dark); color: var(--paper); font-weight: 600; box-shadow: var(--shadow-soft); transition: opacity .25s, transform .25s; }
  .toast-bk.show { opacity: 1; transform: translate(-50%, 0); }
  .toast-bk.err { background: var(--pink); }

  /* map markers */
  .pin { width: 30px; height: 30px; border-radius: 50%; background: var(--card); border: 2.5px solid var(--forest); color: var(--forest);
    display: grid; place-items: center; font: 600 13px/1 var(--f-body); box-shadow: 0 2px 6px rgba(0,0,0,.25); transition: transform .2s; }
  .pin.v { background: var(--forest); border-color: #fff; color: #fff; }
  .pin.cur { background: var(--blossom); border-color: #fff; color: var(--ink); transform: scale(1.22); }
  .fpin { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; color: #fff; border: 2.5px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .fpin.wc { background: var(--pink); } .fpin.park { background: var(--forest); } .fpin.water { background: #5E8FB0; } .fpin.bench { background: var(--slate); }
  .badge-pin { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; padding: 5px 10px 5px 7px; border-radius: 999px;
    background: var(--card); color: var(--ink); font: 600 12px/1.2 var(--f-body); border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .badge-pin.entry .ico { color: var(--slate); }
  .badge-pin.act { background: var(--moss-soft); } .badge-pin.act .ico { color: var(--forest); }
  .me { position: relative; width: 22px; height: 22px; }
  .me .dot { position: absolute; inset: 3px; border-radius: 50%; background: var(--me); border: 3px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.2); }
  .me .arrow { position: absolute; left: 50%; top: -12px; width: 0; height: 0; margin-left: -7px; border: 7px solid transparent; border-bottom: 12px solid var(--me);
    transform-origin: 7px 23px; display: none; }
  .me.has-heading .arrow { display: block; }
  .leaflet-container { font-family: var(--f-body); }
  .leaflet-popup-content-wrapper { border-radius: 16px; box-shadow: var(--shadow-soft); }
  .leaflet-popup-content { margin: 12px 14px; font-size: .95rem; line-height: 1.6; }
  .leaflet-control-attribution { font-size: 10px; }
  .leaflet-bottom.leaflet-right { bottom: var(--panel-h, 0px); }

  /* sheets (Bootstrap offcanvas) */
  .sheet.offcanvas-bottom { height: auto; max-height: 90vh; max-width: 560px; margin: 0 auto; border: 0; border-radius: 28px 28px 0 0; background: var(--card); }
  .sheet .offcanvas-body { padding: 8px 20px max(22px, env(safe-area-inset-bottom)); }
  .sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 6px auto 14px; }
  .stop-photo { aspect-ratio: 4 / 3; border-radius: 22px; }
  .stamp { position: absolute; right: 12px; top: 12px; z-index: 3; transform: rotate(-12deg); }
  .row-stop { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px; border: 0; border-radius: 16px; background: transparent; text-align: left; color: inherit; }
  .row-stop:hover { background: var(--paper); }
  .row-stop.cur { background: var(--blossom-soft); }
  .audio { display: flex; align-items: center; gap: 12px; padding: 8px 16px 8px 8px; border-radius: 999px; background: var(--blossom-soft); }
  .audio .play { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--pink); color: #fff; display: grid; place-items: center; flex: none; }
  .wave { display: flex; align-items: center; gap: 3px; height: 16px; }
  .wave i { width: 3px; border-radius: 2px; background: var(--blossom); height: 30%; }
  .wave i:nth-child(3n) { height: 70%; } .wave i:nth-child(4n+1) { height: 100%; } .wave i:nth-child(5n+2) { height: 50%; }
  .audio.playing .wave i { background: var(--pink); animation: bounce .9s ease-in-out infinite; }
  .audio.playing .wave i:nth-child(2n) { animation-delay: .15s; } .audio.playing .wave i:nth-child(3n) { animation-delay: .3s; }
  @keyframes bounce { 50% { transform: scaleY(.35); } }

  .overlay { position: fixed; inset: 0; z-index: 1800; background: var(--paper); overflow: auto; }
  .overlay[hidden] { display: none; }
  .modal-content { border: 0; border-radius: 28px; background: var(--card); }
  .stamp-lbl { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; padding: 0 4px; }
</style>
</head>
<body>

<div id="map" aria-label="map"></div>

<header class="topbar">
  <a href="index.html" data-keep-lang><span data-icon="back"></span><span class="t-h3 ttl" id="title"></span></a>
  <div class="lang-switch" aria-label="Language"></div>
</header>

<div class="toast-bk" id="toast" role="status" aria-live="polite"></div>

<div class="leftcol">
  <button type="button" class="pill" id="bSim"></button>
  <div class="fac-chips" id="facChips" hidden></div>
</div>

<nav class="ctrl" aria-label="Map controls">
  <button type="button" id="bFollow" class="on"></button>
  <button type="button" id="bCompass"></button>
  <button type="button" id="bLayer"></button>
  <button type="button" id="bFac"></button>
  <button type="button" id="bWhole"></button>
</nav>

<section class="panel" id="panel">
  <button type="button" class="handle" id="bHandle" aria-label="expand / collapse"></button>
  <div class="tw-flex tw-items-center tw-gap-3.5 tw-mb-3" id="nextRow" role="button" tabindex="0">
    <div class="next-thumb" id="nNum">1</div>
    <div class="tw-flex-1 tw-min-w-0">
      <div class="t-caps" id="nKick"></div>
      <div class="t-h3" id="nTitle"></div>
      <div class="t-small" id="nSub"></div>
    </div>
  </div>
  <div class="collapsible">
    <div class="track"><i id="prog"></i></div>
    <div class="tw-flex tw-justify-between t-small tw-mt-1 tw-mb-3"><span id="pStart"></span><span id="pPct" style="color:var(--forest);font-weight:600"></span><span id="pEnd" class="tw-text-right"></span></div>
    <div class="stats tw-mb-3">
      <div><b id="sDist">0</b><span id="lDist"></span></div>
      <div><b id="sTime">0:00</b><span id="lTime"></span></div>
      <div><b id="sKcal">0</b><span id="lKcal"></span></div>
      <div><b id="sVis">0/0</b><span id="lVis"></span></div>
    </div>
  </div>
  <div class="tw-flex tw-gap-2">
    <button type="button" class="btn btn-forest tw-flex-1" id="bStart"></button>
    <button type="button" class="btn btn-card" id="bList"></button>
    <button type="button" class="btn btn-ghost" id="bEnd"></button>
  </div>
</section>

<!-- ============ 02 Ready ============ -->
<div class="overlay" id="ready" hidden>
  <div class="wrap tw-py-5 tw-min-h-full tw-flex tw-flex-col tw-gap-5">
    <div class="tw-flex tw-justify-between tw-items-center">
      <a href="index.html" data-keep-lang class="tw-flex tw-items-center tw-gap-1.5 tw-no-underline" style="color:var(--ink)"><span data-icon="back"></span><span data-i18n="back"></span></a>
      <div class="lang-switch"></div>
    </div>
    <div class="grain tw-rounded-[28px] tw-overflow-hidden" style="background:var(--pink-soft)">
      <svg viewBox="0 0 350 200" class="tw-block tw-w-full tw-h-auto" aria-hidden="true"><rect width="350" height="200" fill="#F9DDE7"/><circle cx="175" cy="104" r="76" fill="#FCEAF0"/><circle cx="175" cy="104" r="50" fill="#DCE6D2"/><rect x="140" y="32" width="70" height="140" rx="14" fill="#1F2A24"/><rect x="146" y="44" width="58" height="116" rx="8" fill="#ECE7DA"/><path d="M150 134 C165 114 172 126 182 102 C188 88 196 86 200 74" stroke="#2F5D46" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M175 64c-9 0-15 7-15 15 0 11 15 24 15 24s15-13 15-24c0-8-6-15-15-15z" fill="#C24F7C"/><circle cx="175" cy="79" r="5" fill="#FFFDF8"/><circle cx="66" cy="56" r="6" fill="#E58FB0"/><circle cx="290" cy="146" r="8" fill="#8AA37B"/><circle cx="300" cy="46" r="4" fill="#C24F7C"/></svg>
    </div>
    <div>
      <p class="t-script tw-mb-1" data-i18n="readyScript"></p>
      <h1 class="t-h1 tw-mb-2" data-i18n-html="readyTitle"></h1>
      <p class="t-small tw-mb-0" data-i18n="readyBody"></p>
    </div>
    <ol class="card-soft tw-list-none tw-m-0 tw-p-4 tw-grid tw-gap-3">
      <li class="tw-flex tw-gap-3 tw-items-center"><span class="num">1</span><span><span class="t-h3 tw-block" data-i18n="step1h"></span><span class="t-small" data-i18n="step1b"></span></span></li>
      <li class="tw-flex tw-gap-3 tw-items-center"><span class="num">2</span><span><span class="t-h3 tw-block" data-i18n="step2h"></span><span class="t-small" data-i18n="step2b"></span></span></li>
      <li class="tw-flex tw-gap-3 tw-items-center"><span class="num">3</span><span><span class="t-h3 tw-block" data-i18n="step3h"></span><span class="t-small" data-i18n="step3b"></span></span></li>
    </ol>
    <div class="tw-mt-auto tw-grid tw-gap-2.5">
      <button type="button" class="btn btn-forest" id="rGo"><span data-icon="locate" data-size="18"></span><span data-i18n="readyGo"></span></button>
      <button type="button" class="btn btn-card" id="rSim" data-i18n="readySim"></button>
      <button type="button" class="btn btn-link tw-no-underline" style="color:var(--ink-soft)" id="rLook" data-i18n="readyLook"></button>
    </div>
  </div>
</div>

<!-- ============ 04 Stops list ============ -->
<div class="offcanvas offcanvas-bottom sheet" tabindex="-1" id="sheetList" aria-labelledby="listTitle">
  <div class="offcanvas-body">
    <div class="grab"></div>
    <div class="tw-flex tw-justify-between tw-items-center tw-mb-2">
      <div><h2 class="t-h2" id="listTitle"></h2><div class="t-small" id="listSub"></div></div>
      <span class="chip" id="listPct"></span>
    </div>
    <div id="listRows" class="tw-grid tw-gap-1 tw-mb-3"></div>
    <button type="button" class="btn btn-card tw-w-full" data-bs-dismiss="offcanvas" data-i18n="close"></button>
  </div>
</div>

<!-- ============ 05 Stop detail ============ -->
<div class="offcanvas offcanvas-bottom sheet" tabindex="-1" id="sheetStop" aria-labelledby="stopTitle">
  <div class="offcanvas-body" id="stopBody"></div>
</div>

<!-- ============ 06 Confirm finish ============ -->
<div class="modal fade" id="confirm" tabindex="-1" aria-labelledby="cTitle">
  <div class="modal-dialog modal-dialog-centered tw-px-3">
    <div class="modal-content tw-p-6 tw-text-center">
      <div class="tw-mx-auto tw-mb-3 tw-w-16 tw-h-16 tw-rounded-full tw-grid tw-place-items-center" style="background:var(--pink-soft);color:var(--pink)" data-icon="flag" data-size="30"></div>
      <h2 class="t-h2 tw-mb-2" id="cTitle" data-i18n="confirmTitle"></h2>
      <p class="t-small tw-mb-4" id="cBody"></p>
      <div class="tw-flex tw-gap-2.5">
        <button type="button" class="btn btn-card tw-flex-1" data-bs-dismiss="modal" data-i18n="keepWalking"></button>
        <button type="button" class="btn btn-forest tw-flex-1" id="cYes" data-i18n="finishSummary"></button>
      </div>
    </div>
  </div>
</div>

<!-- ============ 07 Summary ============ -->
<div class="overlay" id="summary" hidden>
  <div class="wrap tw-py-10 tw-min-h-full tw-flex tw-flex-col tw-gap-5 tw-text-center">
    <div><p class="t-script tw-mb-1" id="sumScript"></p><h1 class="t-display" id="sumTitle"></h1></div>
    <div class="card-soft tw-p-5 tw-text-left">
      <p class="t-caps tw-mb-3" style="color:var(--ink-soft)" data-i18n="passport"></p>
      <div class="tw-grid tw-grid-cols-3 tw-gap-y-4 tw-text-center" id="stamps"></div>
    </div>
    <div class="tw-grid tw-grid-cols-2 tw-gap-2.5" id="sumStats"></div>
    <div class="tw-mt-auto tw-flex tw-gap-2.5">
      <a class="btn btn-card tw-flex-1" href="index.html" data-keep-lang data-i18n="close"></a>
      <button type="button" class="btn btn-forest tw-flex-1" id="bAgain" data-i18n="walkAgain"></button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="common.js"></script>
<script>
(function(){
"use strict";
/* ---------- walk-screen texts ---------- */
const W = {
  th: { start:"เริ่มเดิน", pause:"พักก่อน", resume:"เดินต่อ", finish:"จบ", stops:"จุดแวะ", sim:"จำลองเดิน", simOn:"หยุดจำลอง",
    follow:"ติดตามตำแหน่ง", compass:"เข็มทิศ", sat:"ภาพดาวเทียม", map:"แผนที่", whole:"ดูทั้งเส้นทาง",
    idle:"กด เริ่มเดิน เมื่ออยู่ที่ประตู 1", locating:"กำลังหาตำแหน่ง GPS…", toStart:d=>`ไปจุดเริ่มต้นอีก ${d}`, nextDist:(d,e)=>`อีก ${d} · ราว ${e}`,
    offRoute:d=>`ออกนอกเส้นทาง ${d}`, arrived:n=>`ถึงแล้ว · ${n}`, allDone:"ถึงปลายทางแล้ว 🎉", accuracy:a=>`GPS ±${a} ม.`,
    dist:"ระยะทาง", time:"เวลา", kcal:"กิโลแคล", visited:"ผ่านแล้ว", nextOf:(n,t)=>`ถัดไป · จุดที่ ${n} จาก ${t}`, stopN:n=>`จุดที่ ${n}`,
    noGps:"อุปกรณ์นี้ไม่รองรับ GPS", gpsDenied:"เปิด GPS ไม่ได้ — อนุญาตการเข้าถึงตำแหน่ง แล้วลองใหม่", needHttps:"GPS บนมือถือใช้ได้เมื่อเปิดผ่าน https:// เท่านั้น",
    compassNo:"อุปกรณ์นี้ไม่มีเข็มทิศ", detail:"รายละเอียด", goHere:"ดูบนแผนที่", done:"✓ ผ่านแล้ว", nextTag:"จุดถัดไป" },
  en: { start:"Start", pause:"Pause", resume:"Resume", finish:"Finish", stops:"Stops", sim:"Simulate", simOn:"Stop sim",
    follow:"Follow me", compass:"Compass", sat:"Satellite", map:"Map", whole:"Whole route",
    idle:"Tap Start when you're at Gate 1", locating:"Finding your GPS position…", toStart:d=>`${d} to the start`, nextDist:(d,e)=>`${d} · about ${e}`,
    offRoute:d=>`Off route by ${d}`, arrived:n=>`Arrived · ${n}`, allDone:"You've reached the destination 🎉", accuracy:a=>`GPS ±${a} m`,
    dist:"Distance", time:"Time", kcal:"kcal", visited:"Visited", nextOf:(n,t)=>`Next · stop ${n} of ${t}`, stopN:n=>`Stop ${n}`,
    noGps:"This device has no GPS", gpsDenied:"Can't access GPS — allow location and try again", needHttps:"On phones, GPS only works over https://",
    compassNo:"No compass on this device", detail:"Details", goHere:"Show on map", done:"✓ Visited", nextTag:"Next stop" },
  zh: { start:"开始", pause:"暂停", resume:"继续", finish:"结束", stops:"站点", sim:"模拟步行", simOn:"停止模拟",
    follow:"跟随位置", compass:"指南针", sat:"卫星图", map:"地图", whole:"全程",
    idle:"到达1号门后点击开始", locating:"正在获取 GPS 位置…", toStart:d=>`距起点 ${d}`, nextDist:(d,e)=>`还有 ${d} · 约 ${e}`,
    offRoute:d=>`偏离路线 ${d}`, arrived:n=>`已到达 · ${n}`, allDone:"已到达终点 🎉", accuracy:a=>`GPS ±${a} 米`,
    dist:"距离", time:"时间", kcal:"千卡", visited:"已到", nextOf:(n,t)=>`下一站 · 第 ${n} / ${t} 站`, stopN:n=>`第 ${n} 站`,
    noGps:"此设备不支持 GPS", gpsDenied:"无法使用 GPS — 请允许位置权限后重试", needHttps:"手机上需通过 https:// 打开才能使用 GPS",
    compassNo:"此设备没有指南针", detail:"详情", goHere:"在地图上查看", done:"✓ 已到", nextTag:"下一站" }
};
const w = () => W[lang];

$$("[data-icon]").forEach(el => el.innerHTML = icon(el.dataset.icon, +(el.dataset.size || 22)));
mountLangSwitch();

/* ---------- state ---------- */
const S = {
  mode: "idle",          // idle | running | paused | finished
  source: null,          // gps | sim | drag
  pos: null, snap: null, walked: 0, elapsed: 0, runSince: 0, lastCounted: null,
  visited: new Set(store.get("visited", [])), heading: null, follow: true
};

/* ---------- map ---------- */
const panelEl = $("#panel");
const panelPad = () => [0, panelEl.offsetHeight + 10];
const map = L.map("map", { zoomControl:false, attributionControl:true });
map.fitBounds(L.latLngBounds(ROUTE), { paddingTopLeft:[20, 90], paddingBottomRight: panelPad() });
const layers = {
  map: L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:19, attribution:"© OpenStreetMap" }),
  sat: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom:19, attribution:"Imagery © Esri" })
};
let layer = "map"; layers.map.addTo(map);

L.polyline(ROUTE, { color:"#FFFFFF", weight:11, opacity:.9, lineJoin:"round" }).addTo(map);
// approach (Gate 1 → palace) = grey dashes · tour inside the palace = pink dots
L.polyline(APPROACH, { color:"#7A8A8E", weight:4, opacity:.75, dashArray:"6 8", lineCap:"round" }).addTo(map);
L.polyline(TOUR_ROUTE, { color:"#C24F7C", weight:5, opacity:.6, dashArray:"1 9", lineCap:"round" }).addTo(map);
const walkedLine = L.polyline([], { color:"#2F5D46", weight:6, lineJoin:"round" }).addTo(map);
// distance from where we are back onto the route (straight line; no line is drawn on the map)
const roadBack = (me, target) => dist(me, target);

const pinIcon = (i, cls) => L.divIcon({ className:"", html:`<div class="pin ${cls}">${i+1}</div>`, iconSize:[30,30], iconAnchor:[15,15], popupAnchor:[0,-16] });
const markers = STOPS.map((s,i) => {
  const m = L.marker([s.lat,s.lng], { icon: pinIcon(i, ""), keyboard:true, title: pick(s.title) }).addTo(map);
  m.bindPopup(() => {
    const d = document.createElement("div");
    d.innerHTML = `<div class="t-caps">${esc(w().stopN(i+1))} · ${esc(pick(s.kicker))}</div><div class="t-h3 tw-mb-2">${esc(pick(s.title))}</div>`;
    const b = document.createElement("button"); b.className = "btn btn-forest btn-sm"; b.style.setProperty("--bs-btn-padding-y",".35rem");
    b.textContent = w().detail; b.onclick = () => { map.closePopup(); openStop(i); };
    d.appendChild(b); return d;
  });
  return m;
});

/* entrance (not a stop) and activities (not part of the tour) */
const badgeIcon = (cls, ic, label) => L.divIcon({ className:"", html:`<div class="badge-pin ${cls}">${icon(ic, 16)}<span>${esc(label)}</span></div>`, iconSize:null, iconAnchor:[16,16], popupAnchor:[0,-16] });
const entryMarker = L.marker([ENTRY.lat, ENTRY.lng], { icon: badgeIcon("entry", "park", t("entryShort")), zIndexOffset:-100 }).addTo(map)
  .bindPopup(() => `<div class="t-h3">${esc(pick(ENTRY.title))}</div><div class="t-small">${esc(pick(ENTRY.text))}</div>`);
const actMarkers = ACTIVITIES.map(a => L.marker([a.lat, a.lng], { icon: badgeIcon("act", a.type, t("golfShort")), zIndexOffset:-100 }).addTo(map)
  .bindPopup(() => `<div class="t-caps">${esc(t("activity"))}</div><div class="t-h3">${esc(pick(a.title))}</div><div class="t-small">${esc(pick(a.text))}</div><div class="t-small" style="color:var(--slate)">${esc(pick(a.info))}</div>`));
function refreshBadges(){
  entryMarker.setIcon(badgeIcon("entry", "park", t("entryShort")));
  actMarkers.forEach((m,i) => m.setIcon(badgeIcon("act", ACTIVITIES[i].type, t("golfShort"))));
}

/* facilities layer */
const FAC_TYPES = ["wc","park","water","bench"];
const facOn = new Set(FAC_TYPES);
const facLayer = L.layerGroup();
const facMarkers = FACILITIES.map(f => {
  const m = L.marker([f.lat, f.lng], { icon: L.divIcon({ className:"", html:`<div class="fpin ${f.type}">${icon(f.type, 18)}</div>`, iconSize:[30,30], iconAnchor:[15,15], popupAnchor:[0,-16] }) });
  m.bindPopup(() => {
    const away = S.pos ? `<div class="t-small" style="color:var(--pink)">${esc(t("facAway", { d: fmtDist(dist([S.pos.lat,S.pos.lng],[f.lat,f.lng])) }))}</div>` : "";
    return `<div class="t-h3">${esc(pick(f.name))}</div>${away}<div class="t-small" style="color:var(--slate)">${esc(t("facSample"))}</div>`;
  });
  m._type = f.type; return m;
});
function syncFacilities(){ facLayer.clearLayers(); facMarkers.forEach(m => { if (facOn.has(m._type)) facLayer.addLayer(m); }); }
syncFacilities();
let facVisible = false;
function setFacilities(on){
  facVisible = on;
  if (on) facLayer.addTo(map); else map.removeLayer(facLayer);
  $("#facChips").hidden = !on; render();
}
$("#facChips").addEventListener("click", e => {
  const b = e.target.closest("button[data-fac]"); if (!b) return;
  const k = b.dataset.fac; facOn.has(k) ? facOn.delete(k) : facOn.add(k); syncFacilities(); renderFacChips();
});
function renderFacChips(){
  $("#facChips").innerHTML = FAC_TYPES.map(k => `<button type="button" class="pill ${facOn.has(k) ? "on" : ""}" data-fac="${k}">${icon(k,16)}${esc(t(k))}</button>`).join("");
}

/* me marker */
const meIcon = L.divIcon({ className:"", html:'<div class="me" id="me"><div class="arrow"></div><div class="dot"></div></div>', iconSize:[22,22], iconAnchor:[11,11] });
let meMarker = null, accCircle = null;
function ensureMe(ll){
  if (meMarker) return;
  accCircle = L.circle(ll, { radius:10, color:"#3B82C4", weight:1, fillOpacity:.1, interactive:false }).addTo(map);
  meMarker = L.marker(ll, { icon:meIcon, draggable:true, zIndexOffset:1000 }).addTo(map);
  // drag the blue dot to test without GPS
  meMarker.on("dragstart", () => { if (S.source === "sim") stopSim(); });
  meMarker.on("dragend", () => { const p = meMarker.getLatLng(); S.source = "drag"; onPosition(p.lat, p.lng, 5); });
}

/* ---------- position handling ---------- */
function onPosition(lat, lng, acc){
  const ll = [lat, lng];
  S.pos = { lat, lng, acc };
  ensureMe(ll);
  meMarker.setLatLng(ll); accCircle.setLatLng(ll).setRadius(Math.max(acc, 3));
  // the tour walks back along the same roads as the approach, so only snap to the part we're in;
  // within that part, prefer the stretch near where we were (the route also passes close to itself)
  const [segLo, segHi] = inTour() ? [APPROACH_SEGS, RXY.length-2] : [0, APPROACH_SEGS-1];
  let sn = null;
  if (S.snap && S.snap.off <= CONFIG.offRouteMeters && S.snap.seg >= segLo && S.snap.seg <= segHi){
    let lo = S.snap.seg, hi = S.snap.seg;
    while (lo > segLo && CUM[lo] > S.snap.along - 60) lo--;
    while (hi < segHi && CUM[hi+1] < S.snap.along + 150) hi++;
    const local = snapToRoute(ll, lo, hi);
    if (local.off <= CONFIG.offRouteMeters) sn = local;
  }
  S.snap = sn || snapToRoute(ll, segLo, segHi);
  if (S.mode === "running"){
    if (acc <= CONFIG.maxAccuracy){
      if (S.lastCounted){ const d = dist(S.lastCounted, ll); if (d >= 3 && d < 200) { S.walked += d; S.lastCounted = ll; } }
      else S.lastCounted = ll;
    }
    checkArrivals(ll);
  }
  if (S.follow) map.panTo(ll, { animate:true });
  render();
}
const inTour = () => S.visited.has(STOPS[0].id);
function checkArrivals(ll){
  STOPS.forEach((s,i) => {
    if (S.visited.has(s.id)) return;
    if (i > 0 && !inTour()) return;          // on the way to the palace only the tour start counts
    // arrived = close to the stop, or walked past its point on the route (some buildings sit back from the road)
    const passed = S.snap && S.snap.off <= CONFIG.offRouteMeters && S.snap.along >= s.along - 10;
    if (dist(ll, [s.lat,s.lng]) <= s.radius || passed){
      S.visited.add(s.id); store.set("visited", [...S.visited]);
      const last = i === STOPS.length-1;
      toast(last ? w().allDone : i === 0 ? t("tourBegins") : w().arrived(pick(s.title)));
      if (navigator.vibrate) navigator.vibrate(last ? [200,100,200,100,300] : [200,100,200]);
      if (last) setTimeout(finishRun, 1200); else openStop(i);
    }
  });
}

/* ---------- GPS ---------- */
let watchId = null;
function startGps(){
  if (!navigator.geolocation){ toast(w().noGps, true); return false; }
  if (!window.isSecureContext && !/^(localhost|127\.)/.test(location.hostname) && location.protocol !== "file:") toast(w().needHttps, true);
  S.source = "gps";
  watchId = navigator.geolocation.watchPosition(
    p => { if (S.source === "gps") onPosition(p.coords.latitude, p.coords.longitude, Math.round(p.coords.accuracy)); },
    err => { toast(err.code === 1 ? w().gpsDenied : w().gpsDenied + (window.isSecureContext ? "" : " · " + w().needHttps), true); },
    { enableHighAccuracy:true, maximumAge:2000, timeout:20000 }
  );
  return true;
}
function stopGps(){ if (watchId != null) navigator.geolocation.clearWatch(watchId); watchId = null; }

/* ---------- simulation ---------- */
let simTimer = null, simAlong = 0;
function startSim(){
  stopGps(); S.source = "sim";
  simAlong = S.snap && S.snap.off < 30 ? S.snap.along : 0;
  if (S.mode === "idle" || S.mode === "finished") beginRun();
  else if (S.mode === "paused") resumeRun();
  const step = 1.4 * CONFIG.simSpeedup;  // metres per tick (1 tick = 1 s)
  simTimer = setInterval(() => {
    if (sheetOpen()) return;              // wait while the visitor reads a stop
    const nx = nextStopIndex();             // never step past the next stop, however fast the sim runs
    simAlong = Math.min(nx >= 0 ? STOPS[nx].along : TOTAL, simAlong + step);
    const ll = pointAt(simAlong); onPosition(ll[0], ll[1], 5);
    if (simAlong >= TOTAL) stopSim();
  }, 1000);
  const ll = pointAt(simAlong); onPosition(ll[0], ll[1], 5);
  render();
}
function stopSim(){ clearInterval(simTimer); simTimer = null; if (S.source === "sim") S.source = null; render(); }

/* ---------- compass ---------- */
let compassOn = false;
function onOrient(e){
  let h = null;
  if (typeof e.webkitCompassHeading === "number") h = e.webkitCompassHeading;   // iOS
  else if (e.absolute && typeof e.alpha === "number") h = 360 - e.alpha;        // Android (absolute)
  if (h == null) return;
  S.heading = h; drawHeading();
}
function drawHeading(){
  const el = document.getElementById("me"); if (!el) return;
  el.classList.toggle("has-heading", compassOn && S.heading != null);
  const a = el.querySelector(".arrow"); if (a && S.heading != null) a.style.transform = `rotate(${S.heading}deg)`;
}
async function toggleCompass(){
  if (compassOn){
    compassOn = false;
    removeEventListener("deviceorientationabsolute", onOrient); removeEventListener("deviceorientation", onOrient);
    drawHeading(); render(); return;
  }
  if (!("DeviceOrientationEvent" in window)){ toast(w().compassNo, true); return; }
  try {
    if (typeof DeviceOrientationEvent.requestPermission === "function"){
      if (await DeviceOrientationEvent.requestPermission() !== "granted"){ toast(w().compassNo, true); return; }
    }
  } catch(_){ toast(w().compassNo, true); return; }
  compassOn = true;
  if ("ondeviceorientationabsolute" in window) addEventListener("deviceorientationabsolute", onOrient);
  else addEventListener("deviceorientation", onOrient);
  setTimeout(() => { if (compassOn && S.heading == null) toast(w().compassNo, true); }, 3000);
  render();
}

/* ---------- keep the screen on while walking ---------- */
let wakeLock = null;
async function keepAwake(on){
  try {
    if (on && "wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => wakeLock = null); }
    if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch(_){}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.mode === "running") keepAwake(true); });

/* ---------- run control ---------- */
let tick = null;
function beginRun(){
  S.mode = "running"; S.walked = 0; S.elapsed = 0; S.runSince = Date.now(); S.lastCounted = null;
  S.visited = new Set(); store.set("visited", []);
  clearInterval(tick); tick = setInterval(render, 1000); keepAwake(true);
}
function pauseRun(){ S.elapsed += Date.now() - S.runSince; S.mode = "paused"; if (S.source === "sim") stopSim(); keepAwake(false); }
function resumeRun(){ S.runSince = Date.now(); S.mode = "running"; S.lastCounted = null; keepAwake(true); }
const elapsed = () => S.elapsed + (S.mode === "running" ? Date.now() - S.runSince : 0);
function finishRun(){
  if (S.mode === "running") S.elapsed += Date.now() - S.runSince;
  S.mode = "finished"; stopSim(); stopGps(); clearInterval(tick); keepAwake(false); hideSheets(); render(); showSummary();
}
function goGps(){ stopSim(); if (!startGps()) return; beginRun(); S.follow = true; render(); }

$("#bStart").onclick = () => {
  if (S.mode === "running"){ pauseRun(); render(); return; }
  if (S.mode === "paused"){ resumeRun(); if (S.source !== "sim" && watchId == null) startGps(); render(); return; }
  goGps();
};
$("#bEnd").onclick = () => { if (S.mode === "running" || S.mode === "paused") confirmFinish(); };
$("#bList").onclick = showList;
$("#nextRow").onclick = () => {
  if (farAway) { window.open(VISIT.mapsUrl, "_blank", "noopener"); return; }
  const c = nextStopIndex(); if (c >= 0) openStop(c);
};
$("#bSim").onclick = () => simTimer ? (stopSim(), S.mode === "running" && pauseRun(), render()) : startSim();
$("#bFollow").onclick = () => { S.follow = !S.follow; if (S.follow && S.pos) map.panTo([S.pos.lat, S.pos.lng]); render(); };
$("#bCompass").onclick = toggleCompass;
$("#bLayer").onclick = () => { map.removeLayer(layers[layer]); layer = layer === "map" ? "sat" : "map"; layers[layer].addTo(map); render(); };
$("#bFac").onclick = () => setFacilities(!facVisible);
$("#bWhole").onclick = () => { S.follow = false; map.fitBounds(L.latLngBounds(ROUTE), { paddingTopLeft:[20,90], paddingBottomRight: panelPad() }); render(); };
/* bottom card: drag down to collapse, drag up to expand (tap the handle also toggles) */
function setMini(on){ panelEl.classList.toggle("mini", on); render(); }
$("#bHandle").onclick = e => { if (!panelEl._dragged) setMini(!panelEl.classList.contains("mini")); };
(() => {
  let y0 = null, dy = 0;
  panelEl.addEventListener("pointerdown", e => {
    if (e.target.closest("button:not(.handle), a, #nextRow")) return;   // let real buttons work normally
    y0 = e.clientY; dy = 0; panelEl._dragged = false;
    panelEl.setPointerCapture(e.pointerId); panelEl.classList.add("dragging");
  });
  panelEl.addEventListener("pointermove", e => {
    if (y0 === null) return;
    dy = e.clientY - y0;
    if (Math.abs(dy) > 6) panelEl._dragged = true;
    const mini = panelEl.classList.contains("mini");
    // follow the finger, with resistance in the direction that does nothing
    const v = (mini ? dy < 0 : dy > 0) ? dy : dy / 4;
    panelEl.style.transform = `translateY(${Math.max(-60, v)}px)`;
  });
  const end = () => {
    if (y0 === null) return;
    y0 = null; panelEl.classList.remove("dragging"); panelEl.style.transform = "";
    if (dy > 50) setMini(true); else if (dy < -50) setMini(false);
    setTimeout(() => panelEl._dragged = false, 0);
  };
  panelEl.addEventListener("pointerup", end);
  panelEl.addEventListener("pointercancel", end);
})();
map.on("dragstart", () => { if (S.follow){ S.follow = false; render(); } });

/* ---------- ready overlay ---------- */
const ready = $("#ready");
$("#rGo").onclick = () => { ready.hidden = true; goGps(); };
$("#rSim").onclick = () => { ready.hidden = true; startSim(); };
$("#rLook").onclick = () => { ready.hidden = true; };

/* ---------- sheets ---------- */
const listOC = bootstrap.Offcanvas.getOrCreateInstance("#sheetList");
const stopOC = bootstrap.Offcanvas.getOrCreateInstance("#sheetStop");
const confirmM = bootstrap.Modal.getOrCreateInstance("#confirm");
const sheetOpen = () => $("#sheetStop").classList.contains("show") || $("#sheetList").classList.contains("show");
function hideSheets(){ listOC.hide(); stopOC.hide(); confirmM.hide(); }
$("#sheetStop").addEventListener("hidden.bs.offcanvas", stopSpeech);

function openStop(i){
  const s = STOPS[i], v = S.visited.has(s.id);
  const show = () => {
    $("#stopBody").innerHTML = `
      <div class="grab"></div>
      <div class="tw-relative">
        ${photoHTML(s, "stop-photo")}
        ${v ? `<svg class="stamp" width="80" height="80" viewBox="0 0 86 86" aria-label="${esc(w().done)}"><circle cx="43" cy="43" r="38" fill="#FFFDF8" fill-opacity=".9" stroke="#2F5D46" stroke-width="2.5" stroke-dasharray="3 3"/><circle cx="43" cy="43" r="30" stroke="#2F5D46" stroke-width="1.5" fill="none"/><path d="M31 44l8 8 17-18" stroke="#2F5D46" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>` : ""}
      </div>
      <div class="tw-flex tw-flex-wrap tw-items-center tw-gap-2 tw-mt-4 tw-mb-1">
        <span class="chip pink">${esc(w().stopN(i+1))}</span>
        <span class="t-small">${esc(pick(s.kicker))} · ${esc(fmtDist(s.tourAlong))}</span>
      </div>
      <h2 class="t-h1 tw-mb-2" id="stopTitle">${esc(pick(s.title))}</h2>
      <p class="t-body tw-mb-3">${esc(pick(s.text))}</p>
      <div class="tw-flex tw-flex-wrap tw-gap-2 tw-mb-4">${(pick(s.facts)||[]).map(f => `<span class="chip">${esc(f)}</span>`).join("")}</div>
      <div class="audio tw-mb-3" id="audio">
        <button type="button" class="play" id="bPlay" aria-label="${esc(t("listen"))}">${icon("play", 20)}</button>
        <div class="tw-flex-1"><div class="t-h3" id="playLbl">${esc(t("listen"))}</div><div class="wave">${"<i></i>".repeat(28)}</div></div>
        <span class="t-small" style="color:var(--pink)">${LANGS.find(l => l[0] === lang)[1]}</span>
      </div>
      ${s.photoTip ? `<div class="tw-flex tw-gap-2.5 tw-items-start tw-mb-4"><span style="color:var(--forest)">${icon("camera", 20)}</span><span class="t-small"><b>${esc(t("photoTip"))}:</b> ${esc(pick(s.photoTip))}</span></div>` : ""}
      <div class="tw-flex tw-gap-2.5">
        <button type="button" class="btn btn-card tw-flex-1" id="xGo">${esc(w().goHere)}</button>
        <button type="button" class="btn btn-forest tw-flex-1" data-bs-dismiss="offcanvas">${esc(S.mode === "running" ? t("keepWalking") + " →" : t("close"))}</button>
      </div>`;
    $("#bPlay").onclick = () => speaking ? stopSpeech() : speak(s);
    $("#xGo").onclick = () => { stopOC.hide(); S.follow = false; map.setView([s.lat,s.lng], 18); markers[i].openPopup(); render(); };
    stopOC.show();
  };
  if ($("#sheetList").classList.contains("show")) { $("#sheetList").addEventListener("hidden.bs.offcanvas", show, { once:true }); listOC.hide(); }
  else if ($("#sheetStop").classList.contains("show")) { $("#sheetStop").addEventListener("hidden.bs.offcanvas", show, { once:true }); stopOC.hide(); }
  else show();
}

/* audio guide — reads the stop text aloud with the phone's built-in voice */
let speaking = false;
const VOICE_LANG = { th:"th-TH", en:"en-US", zh:"zh-CN" };
function speak(s){
  if (!("speechSynthesis" in window)) { toast(t("noVoice"), true); return; }
  const voices = speechSynthesis.getVoices();
  const voice = voices.find(v => v.lang.replace("_","-").toLowerCase().startsWith(VOICE_LANG[lang].slice(0,2)));
  if (voices.length && !voice) { toast(t("noVoice"), true); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(pick(s.title) + ". " + pick(s.text));
  u.lang = VOICE_LANG[lang]; if (voice) u.voice = voice; u.rate = 0.95;
  u.onend = u.onerror = () => setPlaying(false);
  speechSynthesis.speak(u); setPlaying(true);
}
function stopSpeech(){ if ("speechSynthesis" in window) speechSynthesis.cancel(); setPlaying(false); }
function setPlaying(on){
  speaking = on;
  const a = $("#audio"); if (!a) return;
  a.classList.toggle("playing", on);
  $("#bPlay").innerHTML = icon(on ? "stop" : "play", 20);
  $("#playLbl").textContent = on ? t("stopListen") : t("listen");
}

function showList(){
  const cur = nextStopIndex(), n = S.visited.size;
  $("#listTitle").textContent = t("listTitle");
  $("#listSub").textContent = t("listSub", { v: n, t: STOPS.length });
  $("#listPct").textContent = tourPct(progressAlong()) + "%";
  $("#listRows").innerHTML = STOPS.map((s,i) => {
    const v = S.visited.has(s.id), c = i === cur;
    const sub = `${pick(s.kicker)} · ${fmtDist(s.tourAlong)}${v ? " · " + w().done : c ? " · " + w().nextTag : ""}`;
    return `<button type="button" class="row-stop ${c ? "cur" : ""}" data-i="${i}">
      <span class="num ${v ? "v" : c ? "cur" : ""}">${i+1}</span>
      <span class="tw-flex-1 tw-min-w-0"><span class="t-h3 tw-block">${esc(pick(s.title))}</span><span class="t-small tw-block" ${c ? 'style="color:var(--pink)"' : ""}>${esc(sub)}</span></span>
      <span style="color:var(--slate)">${icon("chev", 18)}</span></button>`;
  }).join("");
  $$("#listRows .row-stop").forEach(b => b.onclick = () => openStop(+b.dataset.i));
  listOC.show();
}

function confirmFinish(){
  const left = STOPS.filter(s => !S.visited.has(s.id));
  $("#cBody").innerHTML = (left.length ? esc(t("confirmLeft", { n: left.length })) + "<br>" : "") + esc(t("walkedSoFar", { d: fmtDist(S.walked), t: fmtTime(elapsed()) }));
  confirmM.show();
}
$("#cYes").onclick = () => { confirmM.hide(); finishRun(); };

function showSummary(){
  const n = S.visited.size, all = n === STOPS.length;
  $("#sumScript").textContent = all ? t("sumScript") : t("sumScriptPart");
  $("#sumTitle").innerHTML = t(all ? "sumAll" : "sumPart", { n });
  const COLORS = ["#8AA37B","#2F5D46","#C24F7C","#E58FB0","#7A8A8E","#1E3F2F"], ROT = [-8,5,-3,9,-6,4];
  $("#stamps").innerHTML = STOPS.map((s,i) => {
    const v = S.visited.has(s.id), c = v ? COLORS[i % COLORS.length] : "#CFC6B5";
    return `<div><svg width="68" height="68" viewBox="0 0 72 72" style="transform:rotate(${v ? ROT[i] : 0}deg)" aria-hidden="true">
      <circle cx="36" cy="36" r="32" fill="${c}" fill-opacity="${v ? .12 : 0}" stroke="${c}" stroke-width="2" stroke-dasharray="3 3"/>
      <circle cx="36" cy="36" r="25" fill="none" stroke="${c}" stroke-width="1.5"/>
      <text x="36" y="45" text-anchor="middle" font-family="FC Mee Sakul Serif, Trirong, serif" font-weight="700" font-size="24" fill="${c}">${v ? i+1 : "·"}</text></svg>
      <div class="t-small stamp-lbl" style="color:${v ? "var(--ink)" : "var(--slate)"}">${esc(pick(s.title).split(" · ")[0])}</div></div>`;
  }).join("");
  const box = (v,l) => `<div class="tw-rounded-[18px] tw-py-3.5" style="background:var(--moss-soft)"><div class="t-num" style="color:var(--forest-dark)">${esc(v)}</div><div class="t-caps" style="color:var(--forest)">${esc(l)}</div></div>`;
  $("#sumStats").innerHTML = box(fmtDist(S.walked), w().dist) + box(fmtTime(S.elapsed), w().time) + box(String(Math.round(S.walked/1000*CONFIG.kcalPerKm)), w().kcal) + box(`${n}/${STOPS.length}`, w().visited);
  $("#summary").hidden = false;
}
$("#bAgain").onclick = () => {
  $("#summary").hidden = true; S.mode = "idle"; S.walked = 0; S.elapsed = 0; S.visited = new Set(); store.set("visited", []);
  ready.hidden = false; render();
};

/* ---------- toast ---------- */
let toastT;
function toast(msg, err){
  const el = $("#toast");
  el.innerHTML = (err ? "" : `<span style="color:var(--blossom)">${icon("check", 18)}</span>`) + `<span>${esc(msg)}</span>`;
  el.classList.toggle("err", !!err); el.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), err ? 6000 : 3500);
}

/* ---------- render ---------- */
function nextStopIndex(){ for (let i=0;i<STOPS.length;i++) if (!S.visited.has(STOPS[i].id)) return i; return -1; }
function progressAlong(){
  const cur = nextStopIndex(); if (cur === -1) return TOTAL;
  if (!S.snap || !S.pos || S.mode === "idle") return 0;
  return S.snap.off <= CONFIG.offRouteMeters ? S.snap.along : 0;
}
// percent of the tour inside the palace (the walk to the palace doesn't count)
const tourPct = prog => Math.round(Math.max(0, Math.min(1, (prog - APPROACH_LEN) / TOUR_LEN)) * 100);
let farAway = false;   // far from Gate 1 → the next-stop card opens Google Maps instead
const btnIco = (name, label) => `${icon(name, 18)}<span>${esc(label)}</span>`;
function render(){
  const x = w();
  document.title = pick(SITE.title);
  $("#title").textContent = pick(SITE.title);

  // controls
  const ctl = [["#bFollow","locate",x.follow,S.follow],["#bCompass","compass",x.compass,compassOn],["#bLayer","layers",layer === "map" ? x.sat : x.map,layer === "sat"],["#bFac","wc",t("facLayer"),facVisible],["#bWhole","route",x.whole,false]];
  ctl.forEach(([id,ic,label,on]) => { const b = $(id); b.innerHTML = icon(ic, 22); b.title = label; b.setAttribute("aria-label", label); b.classList.toggle("on", !!on); b.setAttribute("aria-pressed", !!on); });
  $("#bSim").innerHTML = icon(simTimer ? "stop" : "sim", 14) + `<span>${esc(simTimer ? x.simOn : x.sim)}</span>`;
  $("#bSim").classList.toggle("on", !!simTimer);
  if (facVisible) renderFacChips();

  // actions
  $("#bStart").innerHTML = S.mode === "running" ? btnIco("pause", x.pause) : S.mode === "paused" ? btnIco("play", x.resume) : btnIco("play", x.start);
  $("#bList").innerHTML = btnIco("list", x.stops);
  $("#bEnd").innerHTML = btnIco("flag", x.finish); $("#bEnd").disabled = !(S.mode === "running" || S.mode === "paused");

  // stats
  $("#lDist").textContent = x.dist; $("#lTime").textContent = x.time; $("#lKcal").textContent = x.kcal; $("#lVis").textContent = x.visited;
  $("#sDist").textContent = fmtDist(S.walked);
  $("#sTime").textContent = fmtTime(elapsed());
  $("#sKcal").textContent = Math.round(S.walked/1000*CONFIG.kcalPerKm);
  $("#sVis").textContent = `${S.visited.size}/${STOPS.length}`;

  // markers
  const cur = nextStopIndex();
  markers.forEach((m,i) => {
    const cls = S.visited.has(STOPS[i].id) ? "v" : i === cur ? "cur" : "";
    if (m._cls !== cls){ m._cls = cls; m.setIcon(pinIcon(i, cls)); }
  });

  // progress
  const prog = progressAlong(), pct = tourPct(prog);
  $("#prog").style.width = pct + "%"; $("#pPct").textContent = pct + "%";
  $("#pStart").textContent = pick(STOPS[0].title).split(" · ")[0]; $("#pEnd").textContent = pick(STOPS[STOPS.length-1].title).split(" · ").pop();
  walkedLine.setLatLngs(prog > 0 ? routeUpTo(prog) : []);

  // next stop
  const sub = $("#nSub"); sub.classList.remove("warn");
  farAway = false;
  if (cur === -1){
    $("#nNum").innerHTML = icon("check", 28); $("#nKick").textContent = x.visited + " " + STOPS.length + "/" + STOPS.length;
    $("#nTitle").textContent = x.allDone; sub.textContent = "";
  } else if (cur === 0){
    // step 1: just get to the palace — navigation only, no stop yet
    $("#nNum").innerHTML = icon("pin", 28);
    $("#nKick").textContent = t("stepApproach");
    $("#nTitle").textContent = t("goToPalace");
    if (!S.pos){
      sub.textContent = (S.mode === "running" && S.source === "gps") ? x.locating : t("approachIdle", { d: fmtDist(APPROACH_LEN) });
    } else {
      const sn = S.snap, onRoute = sn.off <= CONFIG.offRouteMeters, me = [S.pos.lat,S.pos.lng];
      const toGate = dist(me, [ENTRY.lat, ENTRY.lng]);
      if (!onRoute && toGate > CONFIG.farFromStart){
        farAway = true;
        const back = roadBack(me, [ENTRY.lat, ENTRY.lng]);
        sub.textContent = t("farAway", { d: fmtDist(back) }); sub.classList.add("warn");
      } else {
        const back = onRoute ? 0 : roadBack(me, sn.ll);
        const d = back + APPROACH_LEN - sn.along;          // back to the route, then along it
        let txt = x.nextDist(fmtDist(d), fmtEta(d)) + " · " + x.accuracy(S.pos.acc);
        if (!onRoute){ txt = x.offRoute(fmtDist(back)) + " · " + txt; sub.classList.add("warn"); }
        sub.textContent = txt;
      }
    }
  } else {
    const s = STOPS[cur];
    $("#nNum").textContent = cur + 1;
    $("#nKick").textContent = x.nextOf(cur + 1, STOPS.length);
    $("#nTitle").textContent = pick(s.title);
    if (!S.pos){
      sub.textContent = (S.mode === "running" && S.source === "gps") ? x.locating : x.idle;
    } else {
      const sn = S.snap, onRoute = sn.off <= CONFIG.offRouteMeters;
      const back = onRoute ? 0 : roadBack([S.pos.lat,S.pos.lng], sn.ll);
      // back to the route, then along the route
      const d = s.along >= sn.along ? back + s.along - sn.along : back + dist(sn.ll, [s.lat,s.lng]);
      let txt = x.nextDist(fmtDist(d), fmtEta(d)) + " · " + x.accuracy(S.pos.acc);
      if (!onRoute){ txt = x.offRoute(fmtDist(back)) + " · " + txt; sub.classList.add("warn"); }
      sub.textContent = txt;
    }
  }
  document.documentElement.style.setProperty("--panel-h", (innerWidth >= 900 ? 0 : panelEl.offsetHeight) + "px");
  drawHeading();
}

// simulation is a testing tool — only shown when the page is opened with ?demo=1
const DEMO = new URLSearchParams(location.search).get("demo") === "1";
if (!DEMO) { $("#bSim").hidden = true; $("#rSim").hidden = true; }

onLang(() => { refreshBadges(); render(); if ($("#sheetList").classList.contains("show")) showList(); if (!$("#summary").hidden) showSummary(); stopSpeech(); });
applyI18n();

/* ---------- entry: ?stop=N opens a stop, ?fac=1 shows facilities, otherwise the Ready screen ---------- */
const qs = new URLSearchParams(location.search);
if (qs.has("stop")) {
  const i = Math.max(0, Math.min(STOPS.length-1, +qs.get("stop") || 0));
  S.follow = false; map.setView([STOPS[i].lat, STOPS[i].lng], 17); openStop(i);
} else if (qs.get("fac") === "1") {
  S.follow = false; setFacilities(true);
  map.fitBounds(L.latLngBounds(FACILITIES.map(f => [f.lat,f.lng]).concat(ROUTE)), { paddingTopLeft:[20,140], paddingBottomRight: panelPad() });
} else {
  ready.hidden = false;
}
addEventListener("resize", render);
})();
</script>
</body>
</html>
