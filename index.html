<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F1E7">
<title>เส้นทางสู่สวนบ้านแก้ว</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Charm&family=Trirong:wght@600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="tw-config.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============ Top bar ============ -->
<header class="wrap wrap-wide tw-flex tw-items-center tw-justify-between tw-pt-4 tw-pb-3">
  <a href="index.html" class="tw-flex tw-items-center tw-gap-2.5 tw-no-underline" style="color:inherit">
    <svg width="36" height="36" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="17" fill="#2F5D46"/><path d="M8 20 L17 11 L26 20" stroke="#FCEAF0" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 19 V25 H23 V19" stroke="#FCEAF0" stroke-width="2.2" fill="none" stroke-linejoin="round"/><circle cx="17" cy="21.5" r="1.7" fill="#E58FB0"/></svg>
    <span class="tw-leading-tight"><span class="t-h3 tw-block">สวนบ้านแก้ว</span><span class="t-small" data-i18n="brandSub"></span></span>
  </a>
  <div class="lang-switch" aria-label="Language"></div>
</header>

<main>
  <!-- ============ Hero ============ -->
  <section class="wrap wrap-wide tw-pt-2 tw-pb-10">
    <div class="tw-grid lg:tw-grid-cols-2 tw-gap-6 lg:tw-gap-12 tw-items-center">
      <div class="grain tw-relative tw-rounded-[28px] tw-overflow-hidden lg:tw-order-2" style="background:var(--paper-deep)">
        <svg viewBox="0 0 350 300" class="tw-block tw-w-full tw-h-auto" role="img" aria-label="ภาพวาดพระตำหนักเทาในสวน">
          <rect width="350" height="300" fill="#EDE4D3"/>
          <circle cx="262" cy="86" r="44" fill="#FCEAF0"/><circle cx="262" cy="86" r="26" fill="#E58FB0" opacity=".85"/>
          <path d="M0 196 C60 160 120 182 180 168 C240 154 300 178 350 160 V300 H0Z" fill="#8AA37B"/>
          <g fill="#1E3F2F"><circle cx="48" cy="170" r="34"/><circle cx="86" cy="156" r="26"/><circle cx="20" cy="150" r="22"/><rect x="44" y="190" width="7" height="30"/></g>
          <g fill="#2F5D46"><circle cx="304" cy="168" r="28"/><circle cx="332" cy="150" r="22"/><rect x="301" y="186" width="6" height="26"/></g>
          <g fill="#E58FB0"><circle cx="70" cy="146" r="3"/><circle cx="34" cy="160" r="2.5"/><circle cx="58" cy="182" r="3"/><circle cx="318" cy="156" r="2.5"/><circle cx="296" cy="172" r="3"/></g>
          <rect x="128" y="166" width="104" height="54" fill="#F6F1E7"/>
          <path d="M116 168 L180 124 L244 168 Z" fill="#7A8A8E"/><path d="M166 124 L180 112 L194 124 Z" fill="#7A8A8E"/>
          <g fill="#5B6660"><rect x="142" y="180" width="14" height="20" rx="2"/><rect x="173" y="180" width="14" height="20" rx="2"/><rect x="204" y="180" width="14" height="20" rx="2"/></g>
          <rect x="170" y="204" width="20" height="16" fill="#C24F7C"/>
          <path d="M0 232 C80 206 150 228 220 214 C280 204 320 222 350 214 V300 H0Z" fill="#2F5D46"/>
          <path d="M18 290 C80 272 140 286 160 262 C172 248 176 238 180 224" stroke="#FCEAF0" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" fill="none"/>
          <circle cx="18" cy="290" r="6" fill="#FCEAF0"/><circle cx="18" cy="290" r="3" fill="#C24F7C"/>
        </svg>
        <span class="chip blossom tw-absolute tw-top-3.5 tw-left-3.5" style="z-index:3" data-i18n="heroChip"></span>
      </div>

      <div class="lg:tw-order-1">
        <p class="t-script tw-mb-1" data-i18n="heroScript"></p>
        <h1 class="t-display tw-mb-3" data-i18n-html="heroTitle"></h1>
        <p class="t-body tw-mb-5" data-i18n="heroDesc"></p>
        <div class="tw-flex tw-flex-wrap tw-gap-2.5 tw-mb-5">
          <a class="btn btn-forest" href="walk.html" data-keep-lang><span data-i18n="ctaStart"></span></a>
          <a class="btn btn-card" href="#stops"><span data-i18n="ctaStops"></span></a>
        </div>
        <div class="card-soft tw-grid tw-grid-cols-4 tw-py-4 tw-px-2 tw-text-center">
          <div><div class="t-num" style="color:var(--forest)" id="mKm"></div><div class="t-caps" style="color:var(--ink-soft)" data-i18n="statKm"></div></div>
          <div><div class="t-num" style="color:var(--forest)" id="mMin"></div><div class="t-caps" style="color:var(--ink-soft)" data-i18n="statMin"></div></div>
          <div><div class="t-num" style="color:var(--forest)" id="mStops"></div><div class="t-caps" style="color:var(--ink-soft)" data-i18n="statStops"></div></div>
          <div><div class="t-num" style="color:var(--forest)" id="mKcal"></div><div class="t-caps" style="color:var(--ink-soft)" data-i18n="statKcal"></div></div>
        </div>
      </div>
    </div>

    <!-- plan your visit -->
    <a href="visit.html" data-keep-lang class="tw-flex tw-items-center tw-gap-3 tw-mt-6 tw-px-4 tw-py-3.5 tw-rounded-[20px] tw-no-underline lg:tw-max-w-[560px]"
       style="background:var(--pink-soft);color:inherit">
      <span style="color:var(--pink)" data-icon="clock" data-size="26"></span>
      <span class="tw-flex-1"><span class="t-h3 tw-block" data-i18n="planTitle"></span><span class="t-small" data-i18n="planSub"></span></span>
      <span style="color:var(--pink)" data-icon="chev" data-size="20"></span>
    </a>
  </section>

  <!-- ============ Story ============ -->
  <section style="background:var(--card)">
    <div class="wrap tw-py-10">
      <p class="t-caps tw-mb-2" data-i18n="storyKicker"></p>
      <h2 class="t-h1 tw-mb-3" data-i18n-html="storyTitle"></h2>
      <p class="t-body" data-i18n="storyBody"></p>
      <blockquote class="tw-flex tw-gap-3.5 tw-my-5">
        <span class="tw-w-1 tw-rounded tw-flex-none" style="background:var(--blossom)"></span>
        <span class="t-quote" data-i18n="storyQuote"></span>
      </blockquote>
      <p class="t-small tw-mb-0" style="color:var(--slate)" data-i18n="draftNote"></p>
    </div>
  </section>

  <!-- ============ Route timeline ============ -->
  <section id="stops" class="wrap tw-pt-10 tw-pb-8" style="scroll-margin-top:12px">
    <p class="t-caps tw-mb-1" id="routeKicker"></p>
    <h2 class="t-h1 tw-mb-5" data-i18n="routeTitle"></h2>
    <div class="approach-row tw-mb-4" id="approachRow"></div>
    <ol class="tl" id="timeline"></ol>
    <h2 class="t-h2 tw-mt-8 tw-mb-3" data-i18n="actTitle"></h2>
    <div class="tw-grid tw-gap-3" id="activities"></div>
  </section>

  <!-- ============ Features ============ -->
  <section class="wrap tw-pt-6 tw-pb-10">
    <h2 class="t-h2 tw-mb-4" data-i18n="featTitle"></h2>
    <div class="tw-grid tw-grid-cols-2 tw-gap-3">
      <div class="tw-rounded-[20px] tw-p-4" style="background:var(--moss-soft)"><span style="color:var(--forest)" data-icon="pin"></span><h3 class="t-h3 tw-mt-2" data-i18n="f1h"></h3><p class="t-small tw-mb-0" data-i18n="f1b"></p></div>
      <div class="tw-rounded-[20px] tw-p-4" style="background:var(--pink-soft)"><span style="color:var(--pink)" data-icon="pulse"></span><h3 class="t-h3 tw-mt-2" data-i18n="f2h"></h3><p class="t-small tw-mb-0" data-i18n="f2b"></p></div>
      <div class="tw-rounded-[20px] tw-p-4" style="background:var(--blossom-soft)"><span style="color:var(--pink)" data-icon="book"></span><h3 class="t-h3 tw-mt-2" data-i18n="f3h"></h3><p class="t-small tw-mb-0" data-i18n="f3b"></p></div>
      <div class="tw-rounded-[20px] tw-p-4" style="background:var(--paper-deep)"><span data-icon="globe"></span><h3 class="t-h3 tw-mt-2" data-i18n="f4h"></h3><p class="t-small tw-mb-0" data-i18n="f4b"></p></div>
    </div>
  </section>

  <!-- ============ Tips ============ -->
  <section class="wrap tw-pb-10">
    <h2 class="t-h2 tw-mb-3" data-i18n="tipsTitle"></h2>
    <ul class="tw-list-none tw-p-0 tw-m-0 tw-grid tw-gap-2.5">
      <li class="tw-flex tw-gap-2.5 tw-items-center"><span class="tip-check" data-icon="check" data-size="14"></span><span data-i18n="tip1"></span></li>
      <li class="tw-flex tw-gap-2.5 tw-items-center"><span class="tip-check" data-icon="check" data-size="14"></span><span data-i18n="tip2"></span></li>
      <li class="tw-flex tw-gap-2.5 tw-items-center"><span class="tip-check" data-icon="check" data-size="14"></span><span data-i18n="tip3"></span></li>
      <li class="tw-flex tw-gap-2.5 tw-items-center"><span class="tip-check" data-icon="check" data-size="14"></span><span data-i18n="tip4"></span></li>
    </ul>
  </section>

  <!-- ============ Final CTA ============ -->
  <section class="wrap tw-pb-6">
    <div class="grain tw-rounded-[28px] tw-p-7" style="background:var(--forest-dark)">
      <p class="t-script tw-mb-1" style="color:var(--blossom)" data-i18n="endScript"></p>
      <h2 class="t-h1 tw-mb-2" style="color:var(--paper)" data-i18n-html="endTitle"></h2>
      <p class="t-small tw-mb-4" style="color:var(--moss-soft)" data-i18n="endBody"></p>
      <a class="btn btn-pink" href="walk.html" data-keep-lang><span data-i18n="ctaStart"></span></a>
    </div>
  </section>
</main>

<footer class="wrap tw-text-center tw-pb-8 tw-pt-2">
  <p class="t-small tw-mb-1" data-i18n="footer1"></p>
  <p class="t-small tw-mb-0" style="color:var(--slate)" data-i18n="footer2"></p>
</footer>

<style>
  .tip-check { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--moss-soft); color: var(--forest); }
</style>

<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="common.js"></script>
<script>
(function(){
  $$("[data-icon]").forEach(el => el.innerHTML = icon(el.dataset.icon, +(el.dataset.size || 24)));
  mountLangSwitch();

  function renderTimeline(){
    $("#timeline").innerHTML = STOPS.map((s,i) => {
      const last = i === STOPS.length - 1;
      const sub = i === 0 ? t("tourStart") : `${fmtDist(s.tourAlong)} ${t("fromStart")}${last ? " · " + t("destination") : ""}`;
      return `<li>
        <div class="rail"><span class="num ${i === 0 ? "cur" : ""}">${i+1}</span></div>
        <a class="stop-card" href="walk.html?stop=${i}&lang=${lang}">
          ${photoHTML(s)}
          <span class="tw-flex-1 tw-min-w-0">
            <span class="t-caps tw-block" style="color:var(--ink-soft)">${esc(pick(s.kicker))}</span>
            <span class="t-h3 tw-block">${esc(pick(s.title))}</span>
            <span class="t-small tw-block" style="color:var(--forest)">${esc(sub)}</span>
          </span>
        </a>
      </li>`;
    }).join("");
    $("#routeKicker").textContent = t("routeKicker", { n: STOPS.length });
    $("#approachRow").innerHTML = `<a href="walk.html?lang=${lang}" class="tw-flex tw-items-center tw-gap-3 tw-no-underline tw-rounded-[18px] tw-p-3.5" style="background:var(--paper-deep);color:var(--ink);border:1.5px dashed var(--slate)">
      <span class="icon-tile" style="color:var(--slate)">${icon("park", 22)}</span>
      <span class="tw-flex-1"><span class="t-h3 tw-block">${esc(t("approachLabel"))}</span><span class="t-small tw-block" style="color:var(--ink-soft)">${esc(t("approachSub", { d: fmtDist(APPROACH_LEN) }))}</span></span></a>`;
    $("#activities").innerHTML = ACTIVITIES.map(a => `<div class="tw-flex tw-gap-3 tw-items-start tw-rounded-[18px] tw-p-4" style="background:var(--moss-soft)">
      <span class="icon-tile" style="color:var(--forest)">${icon(a.type, 22)}</span>
      <span class="tw-flex-1"><span class="t-caps tw-block" style="color:var(--forest)">${esc(t("activity"))}</span><span class="t-h3 tw-block">${esc(pick(a.title))}</span>
      <span class="t-small tw-block">${esc(pick(a.text))}</span><span class="t-small tw-block" style="color:var(--slate)">${esc(pick(a.info))}</span></span></div>`).join("");
  }
  function renderStats(){
    $("#mKm").textContent = (TOTAL/1000).toFixed(2);
    $("#mMin").textContent = "~" + Math.round(TOTAL / (CONFIG.walkSpeedKmh*1000/60));
    $("#mStops").textContent = STOPS.length;
    $("#mKcal").textContent = "~" + Math.round(TOTAL/1000*CONFIG.kcalPerKm);
  }
  onLang(() => { document.title = pick(SITE.title); renderTimeline(); });
  renderStats();
  applyI18n();
})();
</script>
</body>
</html>
