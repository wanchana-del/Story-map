<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F1E7">
<title>ข้อมูลเยี่ยมชม · สวนบ้านแก้ว</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Charm&family=Trirong:wght@600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="tw-config.js"></script>
<link rel="stylesheet" href="styles.css">
<style>
  .info-row + .info-row { border-top: 1px solid var(--line); }
  .fac-tile { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 6px; border-radius: 18px; text-decoration: none; color: inherit; text-align: center; transition: transform .15s; }
  .fac-tile:hover { transform: translateY(-2px); }
  .dot-open { width: 12px; height: 12px; border-radius: 50%; background: #B9D3A8; box-shadow: 0 0 0 4px rgba(138,163,123,.35); flex: none; }
  .dot-closed { background: var(--blossom); box-shadow: 0 0 0 4px rgba(229,143,176,.3); }
</style>
</head>
<body>

<header class="wrap tw-flex tw-items-center tw-justify-between tw-pt-4 tw-pb-2">
  <a href="index.html" data-keep-lang class="tw-flex tw-items-center tw-gap-1.5 tw-no-underline" style="color:var(--ink)"><span data-icon="back"></span><span data-i18n="back"></span></a>
  <div class="lang-switch" aria-label="Language"></div>
</header>

<main class="wrap tw-pb-10">
  <p class="t-script tw-mb-1 tw-mt-2" data-i18n="visitScript"></p>
  <h1 class="t-h1 tw-mb-5" data-i18n-html="visitTitle"></h1>

  <!-- open status -->
  <section class="grain tw-rounded-[22px] tw-p-5 tw-mb-4" style="background:var(--forest-dark)">
    <div class="tw-flex tw-items-center tw-gap-2.5 tw-mb-2"><span class="dot-open" id="openDot"></span><span class="t-h3" style="color:var(--paper)" id="openText"></span></div>
    <p class="t-small tw-mb-1" style="color:var(--moss-soft)" data-i18n-html="hoursLine"></p>
    <p class="t-small tw-mb-0" style="color:var(--blossom)" id="sampleNote" data-i18n="sampleNote"></p>
  </section>

  <!-- info list -->
  <section class="card-soft tw-mb-7">
    <div class="info-row tw-flex tw-gap-3.5 tw-p-4"><span class="icon-tile" data-icon="ticket"></span><div><h2 class="t-h3" data-i18n="feeH"></h2><p class="t-small tw-mb-0" data-i18n="feeB"></p></div></div>
    <div class="info-row tw-flex tw-gap-3.5 tw-p-4"><span class="icon-tile" data-icon="shirt"></span><div><h2 class="t-h3" data-i18n="dressH"></h2><p class="t-small tw-mb-0" data-i18n="dressB"></p></div></div>
    <div class="info-row tw-flex tw-gap-3.5 tw-p-4"><span class="icon-tile" data-icon="pin"></span><div><h2 class="t-h3" data-i18n="getH"></h2><p class="t-small tw-mb-0" data-i18n="getB"></p></div></div>
    <div class="info-row tw-flex tw-gap-3.5 tw-p-4"><span class="icon-tile" data-icon="clock"></span><div><h2 class="t-h3" data-i18n="timeH"></h2><p class="t-small tw-mb-0" data-i18n="timeB"></p></div></div>
  </section>

  <!-- facilities -->
  <h2 class="t-h2 tw-mb-1" data-i18n="facTitle"></h2>
  <p class="t-small tw-mb-3" style="color:var(--slate)" data-i18n="facHint"></p>
  <section class="tw-grid tw-grid-cols-3 tw-gap-2.5 tw-mb-8" id="facGrid"></section>

  <!-- etiquette -->
  <h2 class="t-h2 tw-mb-3" data-i18n="rulesTitle"></h2>
  <ul class="tw-list-none tw-p-0 tw-m-0 tw-grid tw-gap-3 tw-mb-8">
    <li class="tw-flex tw-gap-3 tw-items-start"><span style="color:var(--pink)" data-icon="quiet"></span><span data-i18n="rule1"></span></li>
    <li class="tw-flex tw-gap-3 tw-items-start"><span style="color:var(--pink)" data-icon="camera"></span><span data-i18n="rule2"></span></li>
    <li class="tw-flex tw-gap-3 tw-items-start"><span style="color:var(--pink)" data-icon="ban"></span><span data-i18n="rule3"></span></li>
    <li class="tw-flex tw-gap-3 tw-items-start"><span style="color:var(--pink)" data-icon="shirt"></span><span data-i18n="rule4"></span></li>
  </ul>

  <!-- group visits -->
  <section class="tw-rounded-[24px] tw-p-5 tw-mb-4" style="background:var(--pink-soft)">
    <div class="tw-flex tw-items-center tw-gap-2.5 tw-mb-1"><span style="color:var(--pink)" data-icon="users" data-size="26"></span><h2 class="t-h3" data-i18n="groupH"></h2></div>
    <p class="t-small tw-mb-3" data-i18n="groupB"></p>
    <div class="tw-flex tw-gap-2" id="groupBtns"></div>
  </section>
  <a class="btn btn-ghost tw-w-full" id="navBtn" target="_blank" rel="noopener"><span data-icon="pin" data-size="18"></span><span data-i18n="navGate"></span></a>
</main>

<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="common.js"></script>
<script>
(function(){
  $$("[data-icon]").forEach(el => el.innerHTML = icon(el.dataset.icon, +(el.dataset.size || 22)));
  mountLangSwitch();
  $("#navBtn").href = VISIT.mapsUrl;
  if (!VISIT.sample) $("#sampleNote").remove();

  const FAC = [["wc","pink"],["park","pink"],["water","pink"],["bench","moss"],["access","moss"],["photo","moss"]];
  const toMin = s => { const [h,m] = s.split(":").map(Number); return h*60+m; };

  function renderOpen(){
    const now = new Date(), d = now.getDay(), mins = now.getHours()*60 + now.getMinutes(), today = VISIT.hours[d];
    const open = !!today && mins >= toMin(today[0]) && mins < toMin(today[1]);
    let text;
    if (open) text = t("openNow", { t: today[1] });
    else {
      text = today ? t("closedNow") : t("byAppointment");
      // next opening within a week (later today counts)
      for (let k = 0; k < 8; k++){
        const dd = (d + k) % 7, h = VISIT.hours[dd];
        if (!h || (k === 0 && mins >= toMin(h[0]))) continue;
        text += " · " + t("opensAt", { d: k === 0 ? "" : t("days")[dd], t: h[0] }).replace(/\s+/g, " ").trim();
        break;
      }
    }
    $("#openText").textContent = text;
    $("#openDot").classList.toggle("dot-closed", !open);
  }
  function renderFac(){
    $("#facGrid").innerHTML = FAC.map(([k,tone]) => `
      <a class="fac-tile" href="walk.html?fac=1&lang=${lang}" style="background:var(--${tone === "pink" ? "blossom-soft" : "moss-soft"})">
        <span style="color:var(--${tone === "pink" ? "pink" : "forest"})">${icon(k === "photo" ? "camera" : k, 26)}</span>
        <span class="t-h3">${esc(t(k))}</span><span class="t-small">${esc(t(k + "N"))}</span>
      </a>`).join("");
  }
  function renderGroup(){
    const b = [];
    if (VISIT.bookingUrl) b.push(`<a class="btn btn-forest tw-flex-1" href="${esc(VISIT.bookingUrl)}" target="_blank" rel="noopener">${esc(t("book"))}</a>`);
    if (VISIT.phone) b.push(`<a class="btn btn-card tw-flex-1" href="tel:${esc(VISIT.phone.replace(/[^0-9+]/g,""))}">${icon("phone",18)}${esc(t("call"))}</a>`);
    $("#groupBtns").innerHTML = b.length ? b.join("") : `<span class="chip pink">${esc(t("contactSoon"))}</span>`;
  }
  onLang(() => { document.title = t("planTitle") + " · " + pick(SITE.title); renderOpen(); renderFac(); renderGroup(); });
  applyI18n();
  setInterval(renderOpen, 60000);
})();
</script>
</body>
</html>
